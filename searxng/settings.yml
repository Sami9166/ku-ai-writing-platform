# Local-only SearXNG settings for the KU AI writing platform.
# Keep this instance private unless you add authentication and rate limiting.
use_default_settings: true

server:
  secret_key: "ku-ai-local-searxng-change-this-secret"
  limiter: false

search:
  formats:
    - html
    - json

# Do not route searches through Brave engines inside SearXNG either.
engines:
  - name: brave
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: brave.news
    disabled: true
  - name: brave.goggles
    disabled: true
  - name: braveapi
    disabled: true
